$kind: http-request
name: Login
url: "{{HOST}}api/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "email": "{{user_email}}",
        "password": "{{user_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      let access_token = JSON.parse(pm.response.body).access_token;

      pm.environment.set('access_token',access_token);
    language: text/javascript
order: 1774574727988
