$kind: http-request
name: Update Product - Admin
url: "{{HOST}}api/products/{{product_id}}"
method: PUT
body:
  type: json
  content: |-
    {
      "name": "Updated Product Name",
      "price": 59.99,
      "stock": 150
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
order: 2
