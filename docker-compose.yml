version: '3.8'

services:
  # Dispatcher
  dispatcher:
    build:
      context: .
      dockerfile: apps/gateway-service/Dockerfile
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://dispatcher-mongo:27017/dispatcher
      - AUTH_SERVICE_URL=http://auth-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - ORDER_SERVICE_URL=http://order-service:5003
      - JWT_SECRET=super-secret-key
    depends_on:
      - dispatcher-mongo
    networks:
      - backend-network
      - frontend-network

  dispatcher-mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    networks:
      - backend-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    environment:
      - MONGO_URI=mongodb://auth-mongo:27017/auth
    depends_on:
      - auth-mongo
    networks:
      - backend-network

  auth-mongo:
    image: mongo:latest
    ports:
      - '27018:27017'
    networks:
      - backend-network

  # Product Service
  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    environment:
      - MONGO_URI=mongodb://product-mongo:27017/products
    depends_on:
      - product-mongo
    networks:
      - backend-network

  product-mongo:
    image: mongo:latest
    ports:
      - '27019:27017'
    networks:
      - backend-network

  # Order Service
  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      - MONGO_URI=mongodb://order-mongo:27017/orders
    depends_on:
      - order-mongo
    networks:
      - backend-network

  order-mongo:
    image: mongo:latest
    ports:
      - '27020:27017'
    networks:
      - backend-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '3001:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    networks:
      - frontend-network

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
